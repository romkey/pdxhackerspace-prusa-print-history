# Same as docker-compose.test.yml but forces a rebuild of the test image.
# Use when system packages, Node, or the base Ruby version change.
#
#   docker compose -f docker-compose.test.build.yml build
#   docker compose -f docker-compose.test.build.yml run --rm test
name: prusa-print-history-test

x-app-base: &app-base
  image: prusa-print-history-dev:latest
  build:
    context: .
    dockerfile: Dockerfile.dev
    pull: true
  environment:
    RAILS_ENV: test
    DB_HOST: prusa-print-history-test-postgres
    DB_PORT: 5432
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    DB_NAME: prusa_print_history_test
    REDIS_URL: redis://prusa-print-history-test-redis:6379/0
    BOOTSNAP_CACHE_DIR: /rails/tmp/cache/bootsnap
    ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: test_only_primary_key_padded_to_32_chars_minimum
    ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: test_only_deterministic_key_padded_to_32_chars_minimum
    ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: test_only_key_derivation_salt_padded_to_32_chars_minimum
  volumes:
    - .:/rails
    - prusa-print-history-test-bundle:/usr/local/bundle
    - prusa-print-history-test-node-modules:/rails/node_modules
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  networks:
    - prusa-print-history-test

services:
  postgres:
    image: postgres:18
    container_name: prusa-print-history-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prusa_print_history_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - prusa-print-history-test

  redis:
    image: redis:8-alpine
    container_name: prusa-print-history-test-redis
    networks:
      - prusa-print-history-test

  test:
    <<: *app-base
    container_name: prusa-print-history-test-runner
    command: >
      bash -c "bundle install &&
               bin/rails db:test:prepare &&
               bin/rails test"

volumes:
  prusa-print-history-test-bundle:
  prusa-print-history-test-node-modules:

networks:
  prusa-print-history-test:
    name: prusa-print-history-test
