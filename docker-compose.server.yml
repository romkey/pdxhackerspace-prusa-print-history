# Production-style stack to run behind an external reverse proxy.
#
# Postgres is NOT included here — point at an external database via
# DATABASE_URL (or DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD / DB_NAME).
# Redis is included for Sidekiq unless REDIS_URL points elsewhere.
#
# Usage:
#   docker compose -f docker-compose.server.yml --env-file .env.production up -d
#
# Pending migrations run automatically when web or sidekiq containers start
# (see bin/docker-entrypoint). Set SKIP_DB_MIGRATE=true to opt out.
name: prusa-print-history

x-app-base: &app-base
  image: ${IMAGE:-ghcr.io/romkey/prusa-print-history:latest}
  environment:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: '1'
    RAILS_SERVE_STATIC_FILES: '1'
    SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    DATABASE_URL: ${DATABASE_URL}
    REDIS_URL: ${REDIS_URL:-redis://prusa-print-history-redis:6379/0}
    STORAGE_ROOT: /data/storage
    HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL}
    HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN}
    ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
    ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
    ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
    AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
    AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
    AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET}
    AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI}
    ADMIN_EMAILS: ${ADMIN_EMAILS}
    SLACK_API_TOKEN: ${SLACK_API_TOKEN:-}
    MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
    SMTP_ADDRESS: ${SMTP_ADDRESS:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_DOMAIN: ${SMTP_DOMAIN:-}
    SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-plain}
    SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-true}
    ORGANIZATION_NAME: ${ORGANIZATION_NAME:-}
    APP_HOST: ${APP_HOST:-localhost}
    APP_PROTOCOL: ${APP_PROTOCOL:-http}
    TIMEZONE: ${TIMEZONE:-UTC}
    RAILS_FORCE_SSL: ${RAILS_FORCE_SSL:-false}
    RAILS_ASSUME_SSL: ${RAILS_ASSUME_SSL:-false}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:-}
    LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-}
    LOCAL_ADMIN_NAME: ${LOCAL_ADMIN_NAME:-Local Admin}
  volumes:
    - prusa-print-history-storage:/data/storage
  networks:
    - prusa-print-history

services:
  redis:
    image: redis:8-alpine
    container_name: prusa-print-history-redis
    restart: unless-stopped
    volumes:
      - prusa-print-history-redisdata:/data
    networks:
      - prusa-print-history

  web:
    <<: *app-base
    container_name: prusa-print-history-web
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - '${WEB_PORT:-3000}:80'

  sidekiq:
    <<: *app-base
    container_name: prusa-print-history-sidekiq
    restart: unless-stopped
    depends_on:
      - redis
    command: bundle exec sidekiq

volumes:
  prusa-print-history-redisdata:
  prusa-print-history-storage:

networks:
  prusa-print-history:
    name: prusa-print-history
